name: Code Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Verify source files are syntactically valid
        run: |
          python -m py_compile src/__init__.py
          python -m py_compile src/model.py
          python -m py_compile src/dataset.py
          python -m py_compile src/inference.py
          python -m py_compile app.py

      - name: Verify requirements.txt is well-formed
        run: |
          python -c "
          with open('requirements.txt') as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith('#'):
                      print(f'OK: {line}')
          "
